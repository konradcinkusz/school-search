# Dependency update automation is declared, and off.
# Every ecosystem carries open-pull-requests-limit: 0, so Dependabot opens no
# version-update pull requests. Security updates and vulnerability alerts are a
# repository setting, not this file. Dependency-automation decision and the
# trigger for turning it on: docs/architecture/00-ARCHITECTURE.md (deviation register).
# Turn an ecosystem on by raising its limit (e.g. 5) in a reviewed pull request.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: "/src/SchoolSearch.Api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: "/web/app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
