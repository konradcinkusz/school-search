    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: school-search-web-dev
      IMAGE: ghcr.io/konradcinkusz/school-search-web:${{ needs.resolve.outputs.release_tag }}
      FLY_REGISTRY_MIRROR: ${{ vars.FLY_REGISTRY_MIRROR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - uses: docker/login-action@v3
        if: vars.FLY_REGISTRY_MIRROR == 'true'
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Ensure app and runtime secrets (idempotent, staged)
        # SESSION_SECRET seals the BFF session cookie (AES-256-GCM, at least 32 bytes). BFF_SHARED_SECRET must be the SAME
        # value as on api, reviews and billing (one GitHub secret feeds all four, so they cannot diverge).
        # GOOGLE_MAPS_API_KEY is optional and read at RUNTIME by the web app (handed to the browser through /api/config).
        # It is a browser key: restrict it by HTTP referrer in the Google Cloud console. Unset means /mapa shows its list fallback.
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BFF_SHARED_SECRET: ${{ secrets.BFF_SHARED_SECRET }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          apps="$(flyctl apps list --json)"
          if ! jq -e --arg a "$APP" '(. // []) | any(.[]; (.Name // .name) == $a)' <<< "$apps" >/dev/null; then
            flyctl apps create "$APP" --org "$FLY_ORG" --yes
          fi
          : "${SESSION_SECRET:?SESSION_SECRET is not set in the dev environment}"
          if [ "${#SESSION_SECRET}" -lt 32 ]; then
            echo "::error::SESSION_SECRET is shorter than 32 characters: the BFF would refuse to seal sessions. Generate with: openssl rand -base64 48" >&2
            exit 1
          fi
          : "${BFF_SHARED_SECRET:?BFF_SHARED_SECRET is not set in the dev environment (the same value goes to web, api, reviews and billing)}"
          {
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'BFF_SHARED_SECRET=%s\n' "$BFF_SHARED_SECRET"
            if [ -n "${GOOGLE_MAPS_API_KEY:-}" ]; then
              printf 'GOOGLE_MAPS_API_KEY=%s\n' "$GOOGLE_MAPS_API_KEY"
            else
              echo "GOOGLE_MAPS_API_KEY is not set in the dev environment: /mapa renders its list fallback (P8)"
            fi
          } | flyctl secrets import --stage --app "$APP"
      - name: Warn when the image is not anonymously pullable
        run: bash flyio/ghcr-probe.sh "$IMAGE"
      - name: Deploy the built image (no rebuild)
        run: |
          set -euo pipefail
          IMG="$(bash flyio/resolve-image.sh "$APP" "$IMAGE")"
          flyctl deploy --config flyio/web.fly.toml --app "$APP" --image "$IMG" --yes
      - name: Post-deploy smoke test (web reaches the api through the BFF)
        run: bash flyio/smoke.sh web "https://${APP}.fly.dev"
