      && needs.detect-changes.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.deploy_postgres.result == 'success' || needs.deploy_postgres.result == 'skipped')
      && (needs.ensure_databases.result == 'success' || needs.ensure_databases.result == 'skipped')
      && (needs.deploy_authservice.result == 'success' || needs.deploy_authservice.result == 'skipped')
      && (needs.deploy_api.result == 'success' || needs.deploy_api.result == 'skipped')
      && (needs.deploy_reviews.result == 'success' || needs.deploy_reviews.result == 'skipped')
      && needs.detect-changes.outputs.deploy_billing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: school-search-billing-dev
      DB_NAME: billingdb
      IMAGE: ghcr.io/konradcinkusz/school-search-billing:${{ needs.resolve.outputs.release_tag }}
      FLY_REGISTRY_MIRROR: ${{ vars.FLY_REGISTRY_MIRROR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - uses: docker/login-action@v3
        if: vars.FLY_REGISTRY_MIRROR == 'true'
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Ensure app and secrets (idempotent, staged)
        # The subject pepper must never change: it keys every stored subject hash (claims and subscriptions).
        # The database billingdb is created by the ensure_databases job.
        # The webhook secret is optional until a payment provider is chosen (ADR-0016). Without it every webhook is
        # rejected in Production, which is the correct failure (never accept unsigned requests).
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SUBJECT_PEPPER: ${{ secrets.BILLING_SUBJECT_PEPPER }}
          REVIEWS_PEPPER: ${{ secrets.REVIEWS_SUBJECT_PEPPER }}
          WEBHOOK_SECRET: ${{ secrets.BILLING_WEBHOOK_SECRET }}
          BFF_SHARED_SECRET: ${{ secrets.BFF_SHARED_SECRET }}
          # Optional (ADR-0011, F6): pushed only when set. The assistant stays off while AI_ENABLED is false in flyio/billing.fly.toml.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          apps="$(flyctl apps list --json)"
          if ! jq -e --arg a "$APP" '(. // []) | any(.[]; (.Name // .name) == $a)' <<< "$apps" >/dev/null; then
            flyctl apps create "$APP" --org "$FLY_ORG" --yes
          fi
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in the dev environment}"
          : "${SUBJECT_PEPPER:?BILLING_SUBJECT_PEPPER is not set in the dev environment}"
          : "${BFF_SHARED_SECRET:?BFF_SHARED_SECRET is not set in the dev environment (the same value goes to web, api, reviews and billing)}"
          if [ -n "${REVIEWS_PEPPER:-}" ] && [ "$SUBJECT_PEPPER" = "$REVIEWS_PEPPER" ]; then
            echo "::error::BILLING_SUBJECT_PEPPER equals REVIEWS_SUBJECT_PEPPER. The two peppers must be different values (flyio/SECRETS.md)." >&2
            exit 1
          fi
          {
            printf 'ConnectionStrings__billingdb=Host=school-search-postgres.internal;Port=5432;Database=%s;Username=%s;Password=%s\n' \
              "$DB_NAME" "$POSTGRES_USER" "$POSTGRES_PASSWORD"
            printf 'Billing__SubjectPepper=%s\n' "$SUBJECT_PEPPER"
            printf 'BFF_SHARED_SECRET=%s\n' "$BFF_SHARED_SECRET"
            if [ -n "${WEBHOOK_SECRET:-}" ]; then
              printf 'Billing__WebhookSecret=%s\n' "$WEBHOOK_SECRET"
            else
              echo "BILLING_WEBHOOK_SECRET is not set in the dev environment: every webhook is rejected until it is set" >&2
            fi
            if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
              printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY"
            fi
          } | flyctl secrets import --stage --app "$APP"
      - name: Warn when the image is not anonymously pullable
        run: bash flyio/ghcr-probe.sh "$IMAGE"
      - name: Deploy the built image (no rebuild)
        run: |
          set -euo pipefail
          IMG="$(bash flyio/resolve-image.sh "$APP" "$IMAGE")"
          flyctl deploy --config flyio/billing.fly.toml --app "$APP" --image "$IMG" --yes
      - name: Post-deploy smoke test (simulate closed, dev seed off)
        run: bash flyio/smoke.sh billing "https://${APP}.fly.dev"

  deploy_mcp:
    name: deploy mcp (Phase D)
    needs: [resolve, detect-changes, test, build, deploy_postgres, ensure_databases, deploy_authservice, deploy_api, deploy_reviews, deploy_billing]
    if: >-
      always() && !cancelled()
      && needs.test.result == 'success'
