      && (needs.ensure_databases.result == 'success' || needs.ensure_databases.result == 'skipped')
      && (needs.deploy_authservice.result == 'success' || needs.deploy_authservice.result == 'skipped')
      && (needs.deploy_api.result == 'success' || needs.deploy_api.result == 'skipped')
      && (needs.deploy_reviews.result == 'success' || needs.deploy_reviews.result == 'skipped')
      && (needs.deploy_billing.result == 'success' || needs.deploy_billing.result == 'skipped')
      && needs.detect-changes.outputs.deploy_mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: school-search-mcp-dev
      IMAGE: ghcr.io/konradcinkusz/school-search-mcp:${{ needs.resolve.outputs.release_tag }}
      FLY_REGISTRY_MIRROR: ${{ vars.FLY_REGISTRY_MIRROR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - uses: docker/login-action@v3
        if: vars.FLY_REGISTRY_MIRROR == 'true'
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Ensure app and optional keys (idempotent, staged)
        # All three values are optional (flyio/SECRETS.md). The agent (ADR-0017) answers 503 ai_unavailable without the key.
        # BFF_SHARED_SECRET lets the MCP service vouch for the caller's address towards Reviews (same value as reviews).
        env:
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BFF_SHARED_SECRET: ${{ secrets.BFF_SHARED_SECRET }}
        run: |
          set -euo pipefail
          apps="$(flyctl apps list --json)"
          if ! jq -e --arg a "$APP" '(. // []) | any(.[]; (.Name // .name) == $a)' <<< "$apps" >/dev/null; then
            flyctl apps create "$APP" --org "$FLY_ORG" --yes
          fi
          # Optional (flyio/SECRETS.md): without it the MCP server calls the catalog anonymously.
          if [ -z "${MCP_API_KEY:-}" ]; then
            echo "MCP_API_KEY is not set in the dev environment: MCP runs with the anonymous rate bucket"
          fi
          # Values on stdin, never on the command line (SECRETS.md section 2). An empty set imports nothing.
          if [ -n "${MCP_API_KEY:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ] || [ -n "${BFF_SHARED_SECRET:-}" ]; then
            {
              if [ -n "${MCP_API_KEY:-}" ]; then
                printf 'MCP_API_KEY=%s\n' "$MCP_API_KEY"
              fi
              if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
                printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY"
              fi
              if [ -n "${BFF_SHARED_SECRET:-}" ]; then
                printf 'BFF_SHARED_SECRET=%s\n' "$BFF_SHARED_SECRET"
              fi
            } | flyctl secrets import --stage --app "$APP"
          fi
      - name: Warn when the image is not anonymously pullable
        run: bash flyio/ghcr-probe.sh "$IMAGE"
      - name: Deploy the built image (no rebuild)
        run: |
          set -euo pipefail
          IMG="$(bash flyio/resolve-image.sh "$APP" "$IMAGE")"
          flyctl deploy --config flyio/mcp.fly.toml --app "$APP" --image "$IMG" --yes
      - name: Post-deploy smoke test
        run: bash flyio/smoke.sh mcp "https://${APP}.fly.dev"

