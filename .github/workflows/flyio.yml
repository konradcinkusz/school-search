name: flyio

# Tag-driven build and ordered deploy (FLY-IO-DEPLOYMENT §10-§11).
# Rules implemented here:
#   - trigger on a tag, diff against the previous tag
#   - a service whose Fly app does not exist is always selected
#   - kernel/contracts changes invalidate every image
#   - one image per changed service, pushed to GHCR, then deployed by reference
#   - import (ghcr.io/konradcinkusz/school-search-import) is built and pushed only; it is never deployed
#   - order: postgres -> authservice (Phase E, gated) -> reviews (Phase E) -> billing (Phase F, gated) -> api -> web -> mcp
#   - billing (Phase F) exists only once src/SchoolSearch.Billing/Dockerfile and flyio/billing.fly.toml both exist (like MCP and Reviews)
#   - every gate accepts success || skipped from its upstream
#   - app and volume creation is idempotent and lives here, not in a shell
#   - secrets reach flyctl on stdin (`flyctl secrets import --stage`), never on the command line (flyio/SECRETS.md §2)
#   - post-deploy /health check; authservice assertions (non-empty JWKS, issuer) via scripts/assert-authservice.sh

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: flyio-deploy
  cancel-in-progress: false

env:
  FLY_ORG: personal
  FLY_REGION: waw
  IMAGE_PREFIX: ghcr.io/konradcinkusz/school-search
  # Must match POSTGRES_USER in flyio/postgres.fly.toml (SECRETS.md section 1).
  POSTGRES_USER: schoolsearch

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SchoolSearch.sln
      - run: dotnet build SchoolSearch.sln --no-restore -c Release -warnaserror
      - run: dotnet test SchoolSearch.sln --no-build -c Release
      - run: bash scripts/check-kernel-size.sh

  detect-changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      AUTHSERVICE_ENABLED: ${{ vars.AUTHSERVICE_ENABLED }}
    outputs:
      build_matrix: ${{ steps.select.outputs.build_matrix }}
      deploy_postgres: ${{ steps.select.outputs.deploy_postgres }}
      deploy_authservice: ${{ steps.select.outputs.deploy_authservice }}
      deploy_reviews: ${{ steps.select.outputs.deploy_reviews }}
      deploy_billing: ${{ steps.select.outputs.deploy_billing }}
      deploy_api: ${{ steps.select.outputs.deploy_api }}
      deploy_web: ${{ steps.select.outputs.deploy_web }}
      deploy_mcp: ${{ steps.select.outputs.deploy_mcp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Select services
        id: select
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            CHANGED="$(git diff --name-only "$PREV" "$TAG")"
            echo "Diffing $PREV..$TAG"
          else
            CHANGED="$(git ls-tree -r --name-only "$TAG")"
            echo "No earlier tag: every file counts as changed"
          fi

          hit() { grep -Eq "$1" <<< "$CHANGED"; }

          # Kernel or contracts change invalidates every image that compiles them.
          KERNEL=false
          if hit '^(src/SchoolSearch\.(ServiceDefaults|Contracts)/|Directory\.(Build|Packages)\.props$|global\.json$)'; then
            KERNEL=true
          fi

          APPS_JSON="$(flyctl apps list --json)"
          exists() { jq -e --arg a "$1" '(. // []) | any(.[]; (.Name // .name) == $a)' <<< "$APPS_JSON" >/dev/null; }
          # want_missing_or_changed <path-regex> <app>: selected when its paths changed or its Fly app is missing
          want_missing_or_changed() { hit "$1" || ! exists "$2"; }

          DEPLOY_POSTGRES=false
          if want_missing_or_changed '^flyio/postgres\.fly\.toml$' school-search-postgres; then DEPLOY_POSTGRES=true; fi

          DEPLOY_API=false
          if [ "$KERNEL" = true ] || want_missing_or_changed '^(src/SchoolSearch\.(Api|Catalog\.Data)/|flyio/api\.fly\.toml$)' school-search-api-dev; then DEPLOY_API=true; fi

          DEPLOY_WEB=false
          if [ "$KERNEL" = true ] || want_missing_or_changed '^(web/|flyio/web\.fly\.toml$)' school-search-web-dev; then DEPLOY_WEB=true; fi

          # MCP exists only from Phase D: needs both its Dockerfile and its fly.toml.
          DEPLOY_MCP=false
          if [ -f src/SchoolSearch.Mcp/Dockerfile ] && [ -f flyio/mcp.fly.toml ]; then
            if [ "$KERNEL" = true ] || want_missing_or_changed '^(src/SchoolSearch\.Mcp/|flyio/mcp\.fly\.toml$)' school-search-mcp-dev; then DEPLOY_MCP=true; fi
          fi

          # Reviews is Phase E: needs its Dockerfile and its fly.toml, like MCP.
          DEPLOY_REVIEWS=false
          if [ -f src/SchoolSearch.Reviews/Dockerfile ] && [ -f flyio/reviews.fly.toml ]; then
            if [ "$KERNEL" = true ] || want_missing_or_changed '^(src/SchoolSearch\.Reviews/|flyio/reviews\.fly\.toml$)' school-search-reviews-dev; then DEPLOY_REVIEWS=true; fi
          fi

          # Billing is Phase F: needs its Dockerfile and its fly.toml, like Reviews and MCP.
          DEPLOY_BILLING=false
          if [ -f src/SchoolSearch.Billing/Dockerfile ] && [ -f flyio/billing.fly.toml ]; then
            if [ "$KERNEL" = true ] || want_missing_or_changed '^(src/SchoolSearch\.Billing/|flyio/billing\.fly\.toml$)' school-search-billing-dev; then DEPLOY_BILLING=true; fi
          fi

          # authservice is Phase E: skipped unless the file exists AND the repo variable enables it.
          # Its image comes from the authservice repository; this repo never builds it.
          DEPLOY_AUTHSERVICE=false
          if [ -f flyio/authservice.fly.toml ] && [ "$AUTHSERVICE_ENABLED" = "true" ]; then
            if want_missing_or_changed '^flyio/authservice\.fly\.toml$' school-search-authservice-dev; then DEPLOY_AUTHSERVICE=true; fi
          fi

          # Import is a one-shot console job (no Fly app, never deployed): its image is built and pushed
          # when its code or the catalog model it compiles against changes, and no deploy job consumes it.
          BUILD_IMPORT=false
          if [ -f src/SchoolSearch.Import/Dockerfile ]; then
            if [ "$KERNEL" = true ] || hit '^src/SchoolSearch\.(Import|Catalog\.Data|Contracts)/'; then BUILD_IMPORT=true; fi
          fi

          MATRIX='[]'
          add_build() { MATRIX="$(jq -c --arg s "$1" --arg d "$2" '. + [{service: $s, dockerfile: $d}]' <<< "$MATRIX")"; }
          if [ "$DEPLOY_API" = true ]; then add_build api src/SchoolSearch.Api/Dockerfile; fi
          if [ "$DEPLOY_WEB" = true ]; then add_build web web/app/Dockerfile; fi
          if [ "$DEPLOY_MCP" = true ]; then add_build mcp src/SchoolSearch.Mcp/Dockerfile; fi
          if [ "$DEPLOY_REVIEWS" = true ]; then add_build reviews src/SchoolSearch.Reviews/Dockerfile; fi
          if [ "$DEPLOY_BILLING" = true ]; then add_build billing src/SchoolSearch.Billing/Dockerfile; fi
          if [ "$BUILD_IMPORT" = true ]; then add_build import src/SchoolSearch.Import/Dockerfile; fi

          {
            echo "build_matrix=$MATRIX"
            echo "deploy_postgres=$DEPLOY_POSTGRES"
            echo "deploy_authservice=$DEPLOY_AUTHSERVICE"
            echo "deploy_reviews=$DEPLOY_REVIEWS"
            echo "deploy_billing=$DEPLOY_BILLING"
            echo "deploy_api=$DEPLOY_API"
            echo "deploy_web=$DEPLOY_WEB"
            echo "deploy_mcp=$DEPLOY_MCP"
          } >> "$GITHUB_OUTPUT"
          echo "Build matrix: $MATRIX"
          echo "postgres=$DEPLOY_POSTGRES authservice=$DEPLOY_AUTHSERVICE reviews=$DEPLOY_REVIEWS billing=$DEPLOY_BILLING api=$DEPLOY_API web=$DEPLOY_WEB mcp=$DEPLOY_MCP"

  build:
    name: build ${{ matrix.service }}
    needs: [detect-changes]
    if: needs.detect-changes.outputs.build_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy_postgres:
    name: deploy postgres
    needs: [detect-changes, test]
    if: >-
      always() && !cancelled()
      && needs.test.result == 'success'
      && needs.detect-changes.result == 'success'
      && needs.detect-changes.outputs.deploy_postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: school-search-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Ensure app, volume and secret (idempotent)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          ensure_app() {
            local apps
            apps="$(flyctl apps list --json)"
            if jq -e --arg a "$1" '(. // []) | any(.[]; (.Name // .name) == $a)' <<< "$apps" >/dev/null; then
              echo "App $1 exists"
            else
              flyctl apps create "$1" --org "$FLY_ORG" --yes
            fi
          }
          ensure_volume() {
            local vols
            vols="$(flyctl volumes list --app "$1" --json)"
            if jq -e --arg n "$2" '(. // []) | any(.[]; (.name // .Name) == $n)' <<< "$vols" >/dev/null; then
              echo "Volume $2 exists on $1"
            else
              flyctl volumes create "$2" --app "$1" --region "$FLY_REGION" --size "$3" --yes
            fi
          }
          ensure_app "$APP"
          ensure_volume "$APP" school_search_pgdata 10
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in the dev environment}"
          printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" | flyctl secrets import --stage --app "$APP"
      - name: Deploy (private network only, single machine)
        run: flyctl deploy --config flyio/postgres.fly.toml --app school-search-postgres --ha=false --yes
      - name: Status
        run: flyctl status --app school-search-postgres

  deploy_authservice:
    name: deploy authservice (Phase E)
    needs: [detect-changes, test, deploy_postgres]
    if: >-
      always() && !cancelled()
      && needs.test.result == 'success'
      && needs.detect-changes.result == 'success'
      && (needs.deploy_postgres.result == 'success' || needs.deploy_postgres.result == 'skipped')
      && needs.detect-changes.outputs.deploy_authservice == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: school-search-authservice-dev
      DB_NAME: authservicedb
      # Pinned tag, set as a repository variable: ghcr.io/konradcinkusz/authservice:v0.3.4 (never :latest).
      AUTHSERVICE_IMAGE: ${{ vars.AUTHSERVICE_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure app and secrets (idempotent, staged)
        # The PEM is one line with literal \n escapes; authservice normalises them (brief §1, VERIFIED).
        # The database authservicedb is created once by hand (docs/runbooks/AUTHSERVICE.md §2): CI does not create databases.
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_PRIVATE_KEY_PEM: ${{ secrets.AUTHSERVICE_JWT_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          apps="$(flyctl apps list --json)"
          if ! jq -e --arg a "$APP" '(. // []) | any(.[]; (.Name // .name) == $a)' <<< "$apps" >/dev/null; then
            flyctl apps create "$APP" --org "$FLY_ORG" --yes
          fi
          : "${AUTHSERVICE_IMAGE:?set the AUTHSERVICE_IMAGE repository variable to the pinned tag}"
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in the dev environment}"
          : "${JWT_PRIVATE_KEY_PEM:?AUTHSERVICE_JWT_PRIVATE_KEY_PEM is not set in the dev environment}"
          {
            printf 'ConnectionStrings__DefaultConnection=Host=school-search-postgres.internal;Port=5432;Database=%s;Username=%s;Password=%s\n' \
              "$DB_NAME" "$POSTGRES_USER" "$POSTGRES_PASSWORD"
            printf 'Jwt__PrivateKeyPem=%s\n' "$JWT_PRIVATE_KEY_PEM"
          } | flyctl secrets import --stage --app "$APP"
      - name: Deploy (pinned image, no rebuild)
        run: flyctl deploy --config flyio/authservice.fly.toml --app school-search-authservice-dev --image "$AUTHSERVICE_IMAGE" --yes
      - name: Post-deploy assertions (health, issuer, non-empty JWKS)
        # Health cannot see an empty key set: scripts/assert-authservice.sh checks discovery, JWKS and the 401 on /me.
        env:
          # Must equal Jwt__Issuer in flyio/authservice.fly.toml.
          AUTH_ISSUER: school-search
        run: bash scripts/assert-authservice.sh "https://${APP}.fly.dev" "$AUTH_ISSUER"

  deploy_reviews:
    name: deploy reviews (Phase E)
    needs: [detect-changes, test, build, deploy_postgres, deploy_authservice]
    if: >-
      always() && !cancelled()
      && needs.test.result == 'success'
      && needs.detect-changes.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.deploy_postgres.result == 'success' || needs.deploy_postgres.result == 'skipped')
      && (needs.deploy_authservice.result == 'success' || needs.deploy_authservice.result == 'skipped')
      && needs.detect-changes.outputs.deploy_reviews == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: school-search-reviews-dev
      DB_NAME: reviewsdb
      IMAGE: ghcr.io/konradcinkusz/school-search-reviews:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure app and secrets (idempotent, staged)
        # The subject pepper must never change: it keys every stored author hash (one review per author and school).
        # The database reviewsdb is created once by hand (docs/runbooks/AUTHSERVICE.md §2).
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SUBJECT_PEPPER: ${{ secrets.REVIEWS_SUBJECT_PEPPER }}
          BFF_SHARED_SECRET: ${{ secrets.BFF_SHARED_SECRET }}
        run: |
          set -euo pipefail
          apps="$(flyctl apps list --json)"
          if ! jq -e --arg a "$APP" '(. // []) | any(.[]; (.Name // .name) == $a)' <<< "$apps" >/dev/null; then
            flyctl apps create "$APP" --org "$FLY_ORG" --yes
          fi
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in the dev environment}"
          : "${SUBJECT_PEPPER:?REVIEWS_SUBJECT_PEPPER is not set in the dev environment}"
          {
            printf 'ConnectionStrings__reviewsdb=Host=school-search-postgres.internal;Port=5432;Database=%s;Username=%s;Password=%s\n' \
              "$DB_NAME" "$POSTGRES_USER" "$POSTGRES_PASSWORD"
            printf 'Reviews__SubjectPepper=%s\n' "$SUBJECT_PEPPER"
            # Optional: without it the BFF cannot attach its shared secret, and the service keeps the anonymous bucket.
            if [ -n "${BFF_SHARED_SECRET:-}" ]; then
              printf 'BFF_SHARED_SECRET=%s\n' "$BFF_SHARED_SECRET"
            else
              echo "BFF_SHARED_SECRET is not set in the dev environment: reviews rate limits fall back to the proxy address" >&2
            fi
          } | flyctl secrets import --stage --app "$APP"
      - name: Deploy the built image (no rebuild)
        run: flyctl deploy --config flyio/reviews.fly.toml --app school-search-reviews-dev --image "$IMAGE" --yes
      - name: Post-deploy health check
        run: curl --fail --silent --show-error --retry 20 --retry-delay 5 --retry-all-errors "https://${APP}.fly.dev/health"

  deploy_billing:
    name: deploy billing (Phase F)
    # Billing validates authservice tokens, so it waits for authservice. Web (the BFF caller) waits for it below.
    needs: [detect-changes, test, build, deploy_postgres, deploy_authservice]
    if: >-
      always() && !cancelled()
      && needs.test.result == 'success'
      && needs.detect-changes.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.deploy_postgres.result == 'success' || needs.deploy_postgres.result == 'skipped')
      && (needs.deploy_authservice.result == 'success' || needs.deploy_authservice.result == 'skipped')
      && needs.detect-changes.outputs.deploy_billing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: school-search-billing-dev
      DB_NAME: billingdb
      IMAGE: ghcr.io/konradcinkusz/school-search-billing:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure app and secrets (idempotent, staged)
        # The subject pepper must never change: it keys every stored subject hash (claims and subscriptions).
        # The database billingdb is created once by hand (docs/runbooks/BILLING.md section 2).
        # The webhook secret is optional until a payment provider is chosen (ADR-0016). Without it every webhook is
        # rejected in Production, which is the correct failure (never accept unsigned requests).
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SUBJECT_PEPPER: ${{ secrets.BILLING_SUBJECT_PEPPER }}
          WEBHOOK_SECRET: ${{ secrets.BILLING_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          apps="$(flyctl apps list --json)"
          if ! jq -e --arg a "$APP" '(. // []) | any(.[]; (.Name // .name) == $a)' <<< "$apps" >/dev/null; then
            flyctl apps create "$APP" --org "$FLY_ORG" --yes
          fi
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in the dev environment}"
          : "${SUBJECT_PEPPER:?BILLING_SUBJECT_PEPPER is not set in the dev environment}"
          {
            printf 'ConnectionStrings__billingdb=Host=school-search-postgres.internal;Port=5432;Database=%s;Username=%s;Password=%s\n' \
              "$DB_NAME" "$POSTGRES_USER" "$POSTGRES_PASSWORD"
            printf 'Billing__SubjectPepper=%s\n' "$SUBJECT_PEPPER"
            if [ -n "${WEBHOOK_SECRET:-}" ]; then
              printf 'Billing__WebhookSecret=%s\n' "$WEBHOOK_SECRET"
            else
              echo "BILLING_WEBHOOK_SECRET is not set in the dev environment: every webhook is rejected until it is set" >&2
            fi
          } | flyctl secrets import --stage --app "$APP"
      - name: Deploy the built image (no rebuild)
        run: flyctl deploy --config flyio/billing.fly.toml --app school-search-billing-dev --image "$IMAGE" --yes
      - name: Post-deploy health check
        run: curl --fail --silent --show-error --retry 20 --retry-delay 5 --retry-all-errors "https://${APP}.fly.dev/health"

  deploy_api:
    name: deploy api
    needs: [detect-changes, test, build, deploy_postgres, deploy_authservice]
    if: >-
      always() && !cancelled()
      && needs.test.result == 'success'
      && needs.detect-changes.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.deploy_postgres.result == 'success' || needs.deploy_postgres.result == 'skipped')
      && (needs.deploy_authservice.result == 'success' || needs.deploy_authservice.result == 'skipped')
      && needs.detect-changes.outputs.deploy_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: school-search-api-dev
      IMAGE: ghcr.io/konradcinkusz/school-search-api:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure app and database connection secret (idempotent, staged)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BFF_SHARED_SECRET: ${{ secrets.BFF_SHARED_SECRET }}
        run: |
          set -euo pipefail
          apps="$(flyctl apps list --json)"
          if ! jq -e --arg a "$APP" '(. // []) | any(.[]; (.Name // .name) == $a)' <<< "$apps" >/dev/null; then
            flyctl apps create "$APP" --org "$FLY_ORG" --yes
          fi
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in the dev environment}"
          {
            printf 'ConnectionStrings__catalogdb=Host=school-search-postgres.internal;Port=5432;Database=catalogdb;Username=%s;Password=%s\n' \
              "$POSTGRES_USER" "$POSTGRES_PASSWORD"
            if [ -n "${BFF_SHARED_SECRET:-}" ]; then
              printf 'BFF_SHARED_SECRET=%s\n' "$BFF_SHARED_SECRET"
            fi
          } | flyctl secrets import --stage --app "$APP"
      - name: Deploy the built image (no rebuild)
        run: flyctl deploy --config flyio/api.fly.toml --app school-search-api-dev --image "$IMAGE" --yes
      - name: Post-deploy health check
        run: curl --fail --silent --show-error --retry 20 --retry-delay 5 --retry-all-errors "https://${APP}.fly.dev/health"

  deploy_web:
    name: deploy web
    needs: [detect-changes, test, build, deploy_postgres, deploy_authservice, deploy_reviews, deploy_billing, deploy_api]
    if: >-
      always() && !cancelled()
      && needs.test.result == 'success'
      && needs.detect-changes.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.deploy_postgres.result == 'success' || needs.deploy_postgres.result == 'skipped')
      && (needs.deploy_authservice.result == 'success' || needs.deploy_authservice.result == 'skipped')
      && (needs.deploy_reviews.result == 'success' || needs.deploy_reviews.result == 'skipped')
      && (needs.deploy_billing.result == 'success' || needs.deploy_billing.result == 'skipped')
      && (needs.deploy_api.result == 'success' || needs.deploy_api.result == 'skipped')
      && needs.detect-changes.outputs.deploy_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: school-search-web-dev
      IMAGE: ghcr.io/konradcinkusz/school-search-web:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure app and runtime secrets (idempotent, staged)
        # SESSION_SECRET seals the BFF session cookie (AES-256-GCM, at least 32 bytes). Required from Phase E.
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BFF_SHARED_SECRET: ${{ secrets.BFF_SHARED_SECRET }}
        run: |
          set -euo pipefail
          apps="$(flyctl apps list --json)"
          if ! jq -e --arg a "$APP" '(. // []) | any(.[]; (.Name // .name) == $a)' <<< "$apps" >/dev/null; then
            flyctl apps create "$APP" --org "$FLY_ORG" --yes
          fi
          : "${SESSION_SECRET:?SESSION_SECRET is not set in the dev environment}"
          {
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            if [ -n "${BFF_SHARED_SECRET:-}" ]; then
              printf 'BFF_SHARED_SECRET=%s\n' "$BFF_SHARED_SECRET"
            fi
          } | flyctl secrets import --stage --app "$APP"
      - name: Deploy the built image (no rebuild)
        run: flyctl deploy --config flyio/web.fly.toml --app school-search-web-dev --image "$IMAGE" --yes
      - name: Post-deploy health check
        run: curl --fail --silent --show-error --retry 20 --retry-delay 5 --retry-all-errors "https://${APP}.fly.dev/health"

  deploy_mcp:
    name: deploy mcp (Phase D)
    needs: [detect-changes, test, build, deploy_postgres, deploy_authservice, deploy_api, deploy_web]
    if: >-
      always() && !cancelled()
      && needs.test.result == 'success'
      && needs.detect-changes.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.deploy_postgres.result == 'success' || needs.deploy_postgres.result == 'skipped')
      && (needs.deploy_authservice.result == 'success' || needs.deploy_authservice.result == 'skipped')
      && (needs.deploy_api.result == 'success' || needs.deploy_api.result == 'skipped')
      && (needs.deploy_web.result == 'success' || needs.deploy_web.result == 'skipped')
      && needs.detect-changes.outputs.deploy_mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: school-search-mcp-dev
      IMAGE: ghcr.io/konradcinkusz/school-search-mcp:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure app and MCP key (idempotent)
        env:
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
        run: |
          set -euo pipefail
          apps="$(flyctl apps list --json)"
          if ! jq -e --arg a "$APP" '(. // []) | any(.[]; (.Name // .name) == $a)' <<< "$apps" >/dev/null; then
            flyctl apps create "$APP" --org "$FLY_ORG" --yes
          fi
          # Optional (flyio/SECRETS.md): without it the MCP server calls the catalog anonymously.
          # Value on stdin, never on the command line (SECRETS.md section 2).
          if [ -n "${MCP_API_KEY:-}" ]; then
            printf 'MCP_API_KEY=%s\n' "$MCP_API_KEY" | flyctl secrets import --stage --app "$APP"
          else
            echo "MCP_API_KEY is not set in the dev environment: MCP runs with the anonymous rate bucket"
          fi
      - name: Deploy the built image (no rebuild)
        run: flyctl deploy --config flyio/mcp.fly.toml --app school-search-mcp-dev --image "$IMAGE" --yes
      - name: Post-deploy health check
        run: curl --fail --silent --show-error --retry 20 --retry-delay 5 --retry-all-errors "https://${APP}.fly.dev/health"
