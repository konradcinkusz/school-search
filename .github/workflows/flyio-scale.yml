name: flyio-scale

# Manual machine-count profile for the stateless apps. The Postgres app is never
# scaled: it has a volume and must stay at one machine (FLY-IO-DEPLOYMENT §8, §12).
# `request-path-2` runs a second api and authservice machine. Every machine runs its EF migrations on start and no
# migration lock exists in the code (flyio/INFRASTRUCTURE-ANALYSIS.md section 7), so the profile needs an explicit
# acknowledgement. `stop` destroys the machines (scale count 0); `start` re-creates one machine per app.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "start = one machine per app; request-path-2 = api and authservice at two; stop = zero machines"
        type: choice
        required: true
        default: start
        options:
          - start
          - request-path-2
          - stop
      acknowledge_no_migration_lock:
        description: "Required for request-path-2: I know two machines can race the same EF migration on start (no migration lock yet)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: flyio-scale
  cancel-in-progress: false

jobs:
  scale:
    name: scale stateless apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PROFILE: ${{ inputs.profile }}
      ACK_NO_LOCK: ${{ inputs.acknowledge_no_migration_lock }}
    steps:
      - name: Refuse request-path-2 without the acknowledgement
        run: |
          if [ "$PROFILE" = "request-path-2" ] && [ "$ACK_NO_LOCK" != "true" ]; then
            echo "::error::request-path-2 needs acknowledge_no_migration_lock=true (no migration lock exists yet; see flyio/INFRASTRUCTURE-ANALYSIS.md section 7)"
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Apply profile
        run: |
          set -euo pipefail
          APPS_JSON="$(flyctl apps list --json)"
          exists() { jq -e --arg a "$1" '(. // []) | any(.[]; (.Name // .name) == $a)' <<< "$APPS_JSON" >/dev/null; }
          scale() {
            if exists "$1"; then
              flyctl scale count "$2" --app "$1" --yes
            else
              echo "Skipping $1: app does not exist"
            fi
          }
          case "$PROFILE" in
            start)
              scale school-search-api-dev 1
              scale school-search-authservice-dev 1
              scale school-search-reviews-dev 1
              scale school-search-billing-dev 1
              scale school-search-web-dev 1
              scale school-search-mcp-dev 1
              ;;
            request-path-2)
              scale school-search-api-dev 2
              scale school-search-authservice-dev 2
              ;;
            stop)
              scale school-search-mcp-dev 0
              scale school-search-web-dev 0
              scale school-search-api-dev 0
              scale school-search-authservice-dev 0
              scale school-search-reviews-dev 0
              scale school-search-billing-dev 0
              ;;
          esac
          echo "Postgres (school-search-postgres) deliberately not touched."
