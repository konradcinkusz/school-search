name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  dotnet:
    name: dotnet build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SchoolSearch.sln
      - name: Build (warnings as errors)
        run: dotnet build SchoolSearch.sln --no-restore -c Release -warnaserror
      - name: Test
        run: dotnet test SchoolSearch.sln --no-build -c Release

  kernel-size:
    name: kernel size ceiling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check ServiceDefaults stays a kernel
        run: bash scripts/check-kernel-size.sh

  web:
    name: web typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm -r --if-present typecheck
      - name: Build
        working-directory: web
        run: pnpm --filter ./app run build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build and start the API (in-memory provider, no secrets)
        run: |
          dotnet build src/SchoolSearch.Api/SchoolSearch.Api.csproj -c Release
          ASPNETCORE_URLS=http://localhost:8080 nohup dotnet src/SchoolSearch.Api/bin/Release/net10.0/SchoolSearch.Api.dll > api.log 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/alive
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build and start the web app
        working-directory: web
        env:
          CATALOG_API_URL: http://localhost:8080
        run: |
          pnpm --filter ./app run build
          PORT=3000 nohup pnpm --filter ./app exec next start -p 3000 > ../web.log 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3000/
      - name: Run Playwright
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
      - name: Dump service logs on failure
        if: failure()
        run: cat api.log web.log || true

  docker-build:
    name: docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SchoolSearch.Api/Dockerfile
          push: false
          load: true
          tags: school-search-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Smoke-test the API image on :8080
        run: |
          docker run -d --name api -p 8080:8080 school-search-api:ci
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/health
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/app/Dockerfile
          push: false
          tags: school-search-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflow files
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  ci-required:
    name: ci-required
    if: always()
    needs: [dotnet, kernel-size, web, e2e, docker-build, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
