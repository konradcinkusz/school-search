name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  dotnet:
    name: dotnet build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Throwaway CI database for PostgresMigrationTests (CATALOG_TEST_PG). Trust auth: no password, no secret.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: school_search
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: school_search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_search -d school_search_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SchoolSearch.sln
      - name: Build (warnings as errors)
        run: dotnet build SchoolSearch.sln --no-restore -c Release -warnaserror
      - name: Test
        env:
          CATALOG_TEST_PG: Host=localhost;Port=5432;Database=school_search_test;Username=school_search
        run: dotnet test SchoolSearch.sln --no-build -c Release

  kernel-size:
    name: kernel size ceiling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check ServiceDefaults stays a kernel
        run: bash scripts/check-kernel-size.sh

  web:
    name: web typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm -r --if-present typecheck
      - name: Build
        working-directory: web
        run: pnpm --filter ./app run build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Generate ephemeral CI secrets (per run, never stored)
        # Values exist only in this job's environment: the BFF shared secret, the web session key and the reviews and
        # billing subject peppers. Written to GITHUB_ENV so later steps see them; GitHub masks nothing it did not receive.
        run: |
          {
            echo "BFF_SHARED_SECRET=$(openssl rand -base64 32)"
            echo "SESSION_SECRET=$(openssl rand -base64 48)"
            echo "Reviews__SubjectPepper=$(openssl rand -hex 32)"
            echo "Billing__SubjectPepper=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - name: Build and start the API (in-memory provider, no secrets)
        run: |
          dotnet build src/SchoolSearch.Api/SchoolSearch.Api.csproj -c Release
          # The demo seed refuses Production; an unset ASPNETCORE_ENVIRONMENT means Production, so CI sets Staging.
          SCHOOLSEARCH_DEMO_SEED=true ASPNETCORE_ENVIRONMENT=Staging ASPNETCORE_URLS=http://localhost:8080 nohup dotnet src/SchoolSearch.Api/bin/Release/net10.0/SchoolSearch.Api.dll > api.log 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/alive
      - name: Build and start the Reviews service (in-memory provider, no authservice)
        # Staging with no ConnectionStrings__reviewsdb selects InMemory. AUTH_BASE_URL is unset on purpose:
        # account routes degrade (P8). Login against a real authservice is NOT RUN in CI.
        run: |
          dotnet build src/SchoolSearch.Reviews/SchoolSearch.Reviews.csproj -c Release
          ASPNETCORE_ENVIRONMENT=Staging ASPNETCORE_URLS=http://localhost:8082 nohup dotnet src/SchoolSearch.Reviews/bin/Release/net10.0/SchoolSearch.Reviews.dll > reviews.log 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8082/alive
      - name: Build and start the Billing service (in-memory provider, mock mode, no authservice)
        # Phase F. Staging with no ConnectionStrings__billingdb selects InMemory. MockMode is stated on purpose, so the
        # simulate endpoint and the synthetic checkout are exercised in CI (MONETIZATION-BRIEF 1c). No webhook secret is
        # set: mock mode accepts unsigned requests only outside Production. AUTH_BASE_URL is unset: account routes
        # answer 503 auth_unavailable (P8). Login against a real authservice is NOT RUN in CI.
        run: |
          dotnet build src/SchoolSearch.Billing/SchoolSearch.Billing.csproj -c Release
          ASPNETCORE_ENVIRONMENT=Staging Billing__MockMode=true ASPNETCORE_URLS=http://localhost:8083 nohup dotnet src/SchoolSearch.Billing/bin/Release/net10.0/SchoolSearch.Billing.dll > billing.log 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8083/alive
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build and start the web app
        working-directory: web
        env:
          CATALOG_API_URL: http://localhost:8080
          REVIEWS_BASE_URL: http://localhost:8082
          BILLING_BASE_URL: http://localhost:8083
        run: |
          pnpm --filter ./app run build
          PORT=3000 nohup pnpm --filter ./app exec next start -p 3000 > ../web.log 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3000/
      - name: Run Playwright
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
      - name: Dump service logs on failure
        if: failure()
        run: |
          tail -n 40 api.log || true
          tail -n 40 reviews.log || true
          tail -n 40 billing.log || true
          tail -n 30 web.log || true

  docker-build:
    name: docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SchoolSearch.Api/Dockerfile
          push: false
          load: true
          tags: school-search-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Smoke-test the API image on :8080
        run: |
          docker run -d --name api -p 8080:8080 school-search-api:ci
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/health
      - name: Build Reviews image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SchoolSearch.Reviews/Dockerfile
          push: false
          load: true
          tags: school-search-reviews:ci
          cache-from: type=gha,scope=reviews
          cache-to: type=gha,mode=max,scope=reviews
      - name: Smoke-test the Reviews image on :8082
        # Host port 8082: the API and MCP containers above hold 8080 and 8081. Staging selects InMemory (no database here).
        run: |
          docker run -d --name reviews -p 8082:8080 \
            -e ASPNETCORE_ENVIRONMENT=Staging \
            -e "Reviews__SubjectPepper=$(openssl rand -hex 32)" \
            school-search-reviews:ci
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8082/health
      - name: Build Billing image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SchoolSearch.Billing/Dockerfile
          push: false
          load: true
          tags: school-search-billing:ci
          cache-from: type=gha,scope=billing
          cache-to: type=gha,mode=max,scope=billing
      - name: Smoke-test the Billing image on :8083
        # Host port 8083: the API, MCP and Reviews containers above hold 8080, 8081 and 8082. Staging selects InMemory
        # and the default MockMode is true outside Production, so /health needs no database and no secret here.
        run: |
          docker run -d --name billing -p 8083:8080 \
            -e ASPNETCORE_ENVIRONMENT=Staging \
            -e "Billing__SubjectPepper=$(openssl rand -hex 32)" \
            school-search-billing:ci
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8083/health
      - name: Build MCP image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SchoolSearch.Mcp/Dockerfile
          push: false
          load: true
          tags: school-search-mcp:ci
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp
      - name: Smoke-test the MCP image on :8081
        # Host port 8081: the API container above still holds 8080. No catalog is reachable in this job,
        # so /health must answer 200 without it.
        run: |
          docker run -d --name mcp -p 8081:8080 school-search-mcp:ci
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8081/health
      - name: Build Import image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SchoolSearch.Import/Dockerfile
          push: false
          tags: school-search-import:ci
          cache-from: type=gha,scope=import
          cache-to: type=gha,mode=max,scope=import
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/app/Dockerfile
          push: false
          tags: school-search-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflow files
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  ci-required:
    name: ci-required
    if: always()
    needs: [dotnet, kernel-size, web, e2e, docker-build, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
