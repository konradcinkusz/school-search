# school-search API (src/SchoolSearch.Api, listens :8080). Fly §4 shape: stateless HTTP service.
# Deploy: build once in CI, then `flyctl deploy --config flyio/api.fly.toml --image ghcr.io/konradcinkusz/school-search-api:<tag>`
# [build] is declared so a local build resolves the same way as CI (paths relative to THIS file).

app = "school-search-api-dev"       # globally unique on Fly; system + service + env
primary_region = "waw"

[build]
  dockerfile = "../src/SchoolSearch.Api/Dockerfile"
  context = ".."                    # repo root: the Dockerfile copies project files from src/

[env]                               # public values only (visible in fly config show and image metadata)
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"
  DATABASE_PROVIDER = "postgres"
  SchoolSearch__TrustProxyClientIpHeader = "true"   # behind the Fly edge; see RateLimiting/ClientIpResolver.cs
  # AI explain (feature 1) and the Phase G search-intent and methodology answers (ADR-0011, ADR-0017). ANTHROPIC_API_KEY is
  # a Fly secret pushed by flyio.yml when the GitHub secret exists. The kill switch stays false: a key alone never turns
  # an AI feature on. Flip to "true" only after the open items in docs/ai/AI-FEATURES.md (O1, O2) and the eval gate close.
  AI_DAILY_TOKEN_BUDGET = "200000"
  # Admin routes validate authservice access tokens (role Admin or SuperAdmin), ADR-0015. Same issuer and audience
  # as authservice (flyio/authservice.fly.toml). Auth__Authority unset would answer the admin group with 404 (P8).
  Auth__Authority = "https://school-search-authservice-dev.fly.dev"
  Auth__Issuer = "school-search"
  Auth__Audience = "school-search"
  # ConnectionStrings__catalogdb and BFF_SHARED_SECRET are Fly secrets (flyio/SECRETS.md). Never put them here.
  # Browsers never call this API directly (BFF in web/), so no CORS origin is set here.

[http_service]
  internal_port = 8080              # must equal the port Kestrel binds (ASPNETCORE_URLS)
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # PINNED: web (server-side proxy, FRONTEND-BFF) and mcp call this in-request.
  # Fly §7: the caller's timeout cannot absorb a cold start on this path, so one machine stays up.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    path = "/health"                # kernel MapDefaultEndpoints(); lists optional integrations
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"            # covers cold start; migrations run after the listener (P4)

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
