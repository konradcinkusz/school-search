# school-search MCP server (streamable HTTP, read-only v1, listens :8080). Fly §4 stateless HTTP shape.
# Deploy uses --image only (built once in CI, flyio.yml build job). [build] is declared so a local build resolves the same way.
# Deploy: `flyctl deploy --config flyio/mcp.fly.toml --image ghcr.io/konradcinkusz/school-search-mcp:<tag>`
# The MCP server owns no database. It reads the catalog only through the api's public URL.

app = "school-search-mcp-dev"
primary_region = "waw"

[build]
  dockerfile = "../src/SchoolSearch.Mcp/Dockerfile"   # paths relative to THIS file
  context = ".."

[env]                               # public values only; MCP_API_KEY is a Fly secret
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"
  CATALOG_API_URL = "https://school-search-api-dev.fly.dev"   # public URL, so the proxy can wake a stopped api
  REVIEWS_BASE_URL = "https://school-search-reviews-dev.fly.dev"   # get_school_reviews (Phase E); public URL, same reason
  SchoolSearch__TrustProxyClientIpHeader = "true"   # behind the Fly edge: the per-IP limit reads Fly-Client-IP (same key as api.fly.toml)
  # Phase G agent (POST /agent/chat, ADR-0017). The agent lives in this service because it owns the read-only tool surface.
  # ANTHROPIC_API_KEY is a Fly secret pushed by flyio.yml when the GitHub secret exists (flyio/SECRETS.md). Without it the
  # endpoint answers 503 ai_unavailable (P8). The kill switch stays false: flipping it to "true" is a reviewed change made
  # after the Phase G eval gate (docs/ai/AI-EVALS.md, docs/runbooks/AI-OPERATIONS.md). A key alone never turns the agent on.
  # Total tokens per UTC day for the agent, process-wide (the cost guard; in memory, resets on restart, ADR-0017).
  AI_DAILY_TOKEN_BUDGET = "100000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero at launch. Trigger to pin (min_machines_running = 1): first real agent traffic.
  # Cold-start budget and reasoning: flyio/INFRASTRUCTURE-ANALYSIS.md section 2.
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
